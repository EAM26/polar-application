name: Build and publish Polar image

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: polar-app-publish-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    outputs:
      image_tag: ${{ steps.version.outputs.image_tag }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Read application version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version="$(bash ./mvnw --batch-mode --no-transfer-progress -q -Dstyle.color=never help:evaluate -Dexpression=project.version -DforceStdout)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a release version such as 0.2.0, got: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Application version: $version"

      - name: Build JAR without tests
        run: bash ./mvnw --batch-mode --no-transfer-progress -Dmaven.test.skip=true clean package

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: em26/polar-app:${{ steps.version.outputs.image_tag }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy-to-pi:
    needs: build-and-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:polar-ci
          version: latest
          ping: 100.126.90.73

      - name: Deploy exact image to Pi
        shell: bash
        env:
          DEPLOY_IMAGE_TAG: ${{ needs.build-and-publish.outputs.image_tag }}
          PI_SSH_PRIVATE_KEY: ${{ secrets.PI_SSH_PRIVATE_KEY }}
          PI_SSH_KNOWN_HOSTS: ${{ vars.PI_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          bash -n scripts/deploy-pi.sh

          printf '%s\n' "$PI_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/pi_deploy_key"
          printf '%s\n' "$PI_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/pi_known_hosts"

          ssh \
            -i "$RUNNER_TEMP/pi_deploy_key" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/pi_known_hosts" \
            -o ConnectTimeout=15 \
            em26@100.126.90.73 \
            "bash -s -- '$DEPLOY_IMAGE_TAG'" < scripts/deploy-pi.sh